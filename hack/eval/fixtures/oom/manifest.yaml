apiVersion: v1
kind: Namespace
metadata:
  name: eval-oom
---
# Writes to /dev/shm, which counts against the memory cgroup, so the container
# is OOM-killed and restarts: exit code 137 and a climbing restart count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: eval-oom
spec:
  replicas: 2
  selector:
    matchLabels: { app: memory-hog }
  template:
    metadata:
      labels: { app: memory-hog }
    spec:
      containers:
        - name: hog
          image: busybox:1.36
          command: ["sh", "-c", "dd if=/dev/zero of=/dev/shm/fill bs=1M count=256; sleep 3600"]
          resources:
            limits: { memory: 32Mi }
            requests: { memory: 32Mi }
