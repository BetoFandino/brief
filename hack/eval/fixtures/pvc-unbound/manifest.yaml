apiVersion: v1
kind: Namespace
metadata:
  name: eval-pvc
---
# No such StorageClass, so the claim never binds and the pod stays Pending for a
# reason that lives two hops away from the pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: eval-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nonexistent-class-brief-eval
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: needs-storage
  namespace: eval-pvc
spec:
  replicas: 1
  serviceName: needs-storage
  selector:
    matchLabels: { app: needs-storage }
  template:
    metadata:
      labels: { app: needs-storage }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: data }
